raw_data: data/raw
proc_data: data/processed/
cache_file: data/processed/session_cache.json
out_fig: output/figures
out_logs: output/logs
gap_factor: 3 # should be > 1
motion_threshold_rad_s: 1
standstill_min_s: 3
wheel_radius: 0.19 # in m
pit_min_s: 60 # a pit stop is max of 3min but also could be longer than that or lesss than that, this is an assumtpion
grid_rate_hz: 250 # rationale is in 06_preprocess notebook
# cutoff per column prefix in Hz
#columns not listed are left unfiltered
# decided in notebooks/06_preprocess.ipynb
cutoffs: { 
    "pedal_brakes_pressure": 15, 
    "front_angular_velocity": 5,
    "imu_acceleration": 10,
    "imu_angular_rate": 10,
}

offset_channels: {
    "imu_angular_rate": ["x", "y", "z"],
    "imu_acceleration": ["x"],
}

files: [
    "hv_power",
    "imu_angular_rate",
    "imu_acceleration",
    "vehicle_position",
    "vehicle_speed",
    "vehicle_curvilinear_coordinates",
    "pedal_brakes_pressure",
    "pedal_throttle",
    "steer_angle",
    "front_angular_velocity",
    "inv_r_id_a8_n_actual_filt",
    "inv_l_id_a8_n_actual_filt",
    "inv_r_id_27_iq_actual",
    "inv_l_id_27_iq_actual",
]

# distance grid in meters
distance_grid_step_m: 0.3

## segmentation variables
curvature_smooth_window_m: 5
k_straight: 0.021
min_straight_m: 20
k_corner: 0.0385
k_link: 0.025
max_link_m: 35

phase_smooth_m: 2.4
throttle_off: 0.01
throttle_full: 0.95
brake_off_bar: 0.5
steer_zero_deg: 10
deadband_throttle_per_m: 0.02
deadband_brake_bar_per_m: 1.0
deadband_steer_deg_per_m: 2.5

segment_files : {
    "grid": "grid_phases.parquet",
    "laps": "laps.parquet",
    "gaps": "gaps.parquet",
    "zones": "zones.parquet",
    "apexes": "apexes.parquet",
    "stints": "stints.parquet",
    "standstills": "standstills.parquet",
}

needed_channels : [
    "pedal_throttle__throttle",
    "pedal_brakes_pressure__front",
    "pedal_brakes_pressure__rear",
    "vehicle_speed__u",
    "imu_acceleration__y",
    "imu_acceleration__x",
    "vehicle_position__x",
    "vehicle_position__y",
    "vehicle_curvilinear_coordinates__n",
    "front_angular_velocity__fl",
    "front_angular_velocity__fr",
    "hv_power__power",
    "inv_l_id_a8_n_actual_filt__n_act_filt",
    "inv_r_id_a8_n_actual_filt__n_act_filt",
    "inv_l_id_27_iq_actual__iq_act_filt",
    "inv_r_id_27_iq_actual__iq_act_filt",
    "steer_angle__angle"
]

excluded_laps: [2] # lap numbers
warmup_laps: [1] #lap numers

delta_smooth_m: 10        # loss-rate averaging window, metres
delta_color_clip_q: 0.98  # map colour range clipped at this quantile of |loss rate|